<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fun Stuff | Sheng Cui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: "Inter", sans-serif; background: #fff; color: #111; }
a { text-decoration: none; color: inherit; }
img, video { display: block; max-width: 100%; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 2.5rem;
  padding: 0 2.5rem; height: 52px;
  background: #fff; border-bottom: 1px solid #e8e8e8;
  z-index: 100;
}
nav a {
  font-size: 0.82rem; font-weight: 500; color: #666;
  letter-spacing: 0.01em; padding: 0.25rem 0;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
nav a:hover { color: #111; }
nav a.active { color: #111; border-bottom-color: #111; }

/* PAGE */
.page {
  max-width: 1000px;
  margin: 0 auto;
  padding: calc(52px + 3.5rem) 2.5rem 6rem;
}

h2 {
  font-size: 2rem;
  font-weight: 500;
  letter-spacing: -0.02em;
  margin-bottom: 1.75rem;
}

section { margin-bottom: 4.5rem; }

.media-full {
  width: 100%;
  border-radius: 4px;
  background: #f5f5f5;
}

.trio {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1.5rem;
}
.trio img {
  width: 100%;
  aspect-ratio: 4/3;
  object-fit: cover;
  border-radius: 4px;
}

@media (max-width: 700px) {
  nav { gap: 1.25rem; padding: 0 1.25rem; }
  .trio { grid-template-columns: 1fr; }
  h2 { font-size: 1.6rem; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html">About</a>
  <a href="resume.html">Resume</a>
  <a href="projects.html">Projects</a>
  <a href="contact.html">Contact</a>
  <a href="fun.html" class="active">Fun Stuff</a>
</nav>

<div class="page">

  <section>
    <h2>Sheng Plays Chopin Op. 48 No. 1</h2>
    <video class="media-full" src="images/piano.mp4" controls playsinline></video>
  </section>

  <section>
    <h2>Fish Around Ithaca</h2>
    <div class="trio">
      <img src="images/fish1.jpg" alt="Fish caught around Ithaca">
      <img src="images/fish2.jpg" alt="Fish caught around Ithaca">
      <img src="images/fish3.jpg" alt="Fish caught around Ithaca">
    </div>
  </section>

  <section>
    <h2>I Arrange and Sing A Cappella</h2>
    <img class="media-full" src="images/acapella.jpg" alt="A cappella performance">
  </section>

  <section>
    <h2>Took Many Tries</h2>
    <video class="media-full" src="images/pool.mp4" controls playsinline></video>
  </section>

</div>

</body>
</html>
