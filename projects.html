<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projects | Sheng Cui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: "Inter", sans-serif; background: #fff; color: #111; }
a { text-decoration: none; color: inherit; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }

nav {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 2.5rem;
  padding: 0 2.5rem; height: 52px;
  background: #fff; border-bottom: 1px solid #e8e8e8;
  z-index: 100;
}
nav a {
  font-size: 0.82rem; font-weight: 500; color: #666;
  letter-spacing: 0.01em; padding: 0.25rem 0;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
nav a:hover { color: #111; }
nav a.active { color: #111; border-bottom-color: #111; }

.page {
  padding-top: 52px;
  max-width: 900px;
  margin: 0 auto;
  padding-left: 2.5rem;
  padding-right: 2.5rem;
  padding-bottom: 6rem;
}

.page h2 {
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #999;
  padding-top: 3.5rem;
  margin-bottom: 2.5rem;
}

/* 2×2 grid */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
}

.proj-card {
  display: block;
  cursor: pointer;
  border-radius: 4px;
  overflow: hidden;
  border: 1px solid #e8e8e8;
  transition: box-shadow 0.15s, transform 0.15s;
}

.proj-card:hover {
  box-shadow: 0 4px 20px rgba(0,0,0,0.08);
  transform: translateY(-2px);
}

.proj-img {
  width: 100%;
  aspect-ratio: 4/3;
  background: #f5f5f5;
  overflow: hidden;
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
}

.proj-img img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* Placeholder with project initial */
.proj-ph {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  font-weight: 300;
  color: #ccc;
  letter-spacing: -0.02em;
  pointer-events: none;
}

.proj-label {
  padding: 0.85rem 1rem;
  font-size: 0.875rem;
  font-weight: 500;
  color: #111;
  background: #fff;
  border-top: 1px solid #e8e8e8;
}

@media (max-width: 600px) {
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav>
  <a href="about.html">About</a>
  <a href="resume.html">Resume</a>
  <a href="projects.html" class="active">Projects</a>
  <a href="contact.html">Contact</a>
</nav>

<div class="page">
  <h2>Projects</h2>
  <div class="grid">

    <a href="ekimul.html" class="proj-card">
      <div class="proj-img">
        <!-- Replace src with your image path, e.g. images/ekimul.jpg -->
        <img src="images/ekimul.jpg" alt="ekimul" onerror="this.style.display='none'">
        <div class="proj-ph">ek</div>
      </div>
      <div class="proj-label">ekimul</div>
    </a>

    <a href="oct.html" class="proj-card">
      <div class="proj-img">
        <img src="images/oct.jpg" alt="OCT Pipeline" onerror="this.style.display='none'">
        <div class="proj-ph">OCT</div>
      </div>
      <div class="proj-label">GPU-Accelerated OCT Pipeline</div>
    </a>

    <a href="ic.html" class="proj-card">
      <div class="proj-img">
        <img src="images/ic.jpg" alt="Analog IC" onerror="this.style.display='none'">
        <div class="proj-ph">IC</div>
      </div>
      <div class="proj-label">Analog IC Neural Bridge Chip</div>
    </a>

    <a href="iv.html" class="proj-card">
      <div class="proj-img">
        <img src="images/iv.jpg" alt="IV Detector" onerror="this.style.display='none'">
        <div class="proj-ph">IV</div>
      </div>
      <div class="proj-label">Bioimpedance IV Infiltration Detector</div>
    </a>

  </div>
</div>

</body>
</html>
