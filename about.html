<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheng Cui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: "Inter", sans-serif; background: #fff; color: #111; }
a { text-decoration: none; color: inherit; }
img { display: block; max-width: 100%; }

/* NAV */
nav {
  position: fixed; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 2.5rem;
  padding: 0 2.5rem; height: 52px;
  background: #fff; border-bottom: 1px solid #e8e8e8;
  z-index: 100;
}
nav a {
  font-size: 0.82rem; font-weight: 500; color: #666;
  letter-spacing: 0.01em; padding: 0.25rem 0;
  border-bottom: 2px solid transparent;
  transition: color 0.15s, border-color 0.15s;
}
nav a:hover { color: #111; }
nav a.active { color: #111; border-bottom-color: #111; }

/* HERO */
.hero {
  position: relative;
  width: 100%;
  height: 420px;
  margin-top: 52px;
  overflow: hidden;
  background: #222;
  display: flex; align-items: center; justify-content: center;
}
.hero img.hero-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.7;
}
.hero-title {
  position: relative;
  font-size: clamp(2rem, 5vw, 3.5rem);
  font-weight: 300;
  letter-spacing: -0.02em;
  color: #fff;
  text-shadow: 0 1px 20px rgba(0,0,0,0.5);
  z-index: 1;
}

/* ABOUT */
.about {
  max-width: 900px;
  margin: 0 auto;
  padding: 4rem 2.5rem 6rem;
}
.about h2 {
  font-size: 1.1rem;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: #999;
  margin-bottom: 2.5rem;
}
.about-inner {
  display: grid;
  grid-template-columns: 220px 1fr;
  gap: 3rem;
  align-items: start;
}
.headshot {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  border-radius: 4px;
}
.bio {
  font-size: 0.95rem;
  line-height: 1.8;
  color: #444;
}

/* RESPONSIVE */
@media (max-width: 640px) {
  .about-inner { grid-template-columns: 1fr; }
  .headshot { max-width: 180px; }
  .hero { height: 280px; }
}
</style>
</head>
<body>

<nav>
  <a href="index.html" class="active">About</a>
  <a href="resume.html">Resume</a>
  <a href="projects.html">Projects</a>
  <a href="contact.html">Contact</a>
</nav>

<!-- HERO — replace background.jpg with your own image name if different -->
<div class="hero">
  <img class="hero-bg" src="images/background.jpg" alt="">
  <h1 class="hero-title">Sheng Cui Portfolio</h1>
</div>

<!-- ABOUT -->
<section class="about">
  <h2>About Me</h2>
  <div class="about-inner">

    <img class="headshot" src="images/headshot.jpg" alt="Sheng Cui">

    <p class="bio">
      Write your bio here. Click the pencil icon on GitHub to edit this file and replace this text with your own paragraph.
    </p>

  </div>
</section>

</body>
</html>
